<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a1220">
  <title>Créer ton lien 🌹</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="bg-layer show" style="background-image:url('img/bg-peonies.jpg')"></div>
    <div class="veil"></div>
  </div>
  <div class="petals" aria-hidden="true"></div>

  <main class="stage">
    <section class="screen active">
      <div class="card">
        <p class="eyebrow">Préparer la surprise</p>
        <h1 class="display small">Crée ton lien</h1>
        <p class="soft" style="margin-left:0">Remplis, copie, envoie. Ses réponses te reviendront à la fin.</p>

        <form id="create-form" autocomplete="off">
          <label class="label" for="pour">Son prénom</label>
          <input class="field" id="pour" type="text" maxlength="30" placeholder="Inès" required>

          <span class="label">C'est…</span>
          <div class="seg" role="radiogroup" aria-label="Accords">
            <label><input type="radio" name="g" value="f" checked><span>Elle</span></label>
            <label><input type="radio" name="g" value="m"><span>Il</span></label>
          </div>

          <label class="label" for="de">Ton prénom</label>
          <input class="field" id="de" type="text" maxlength="30" placeholder="Jonathan" required>

          <label class="label" for="tel">Ton numéro WhatsApp <span>(optionnel)</span></label>
          <input class="field" id="tel" type="tel" maxlength="20" placeholder="33612345678">
          <p class="note-small">Format international sans « + ». Sans numéro, ses réponses s'envoient par partage ou SMS.</p>

          <button class="btn primary full" type="submit" style="margin-top:24px">Générer le lien</button>
        </form>

        <div class="result-link" id="result" hidden>
          <input class="field" id="link" type="text" readonly aria-label="Lien généré" style="font-size:0.9rem">
          <div class="row">
            <button class="btn primary" id="copy" type="button">Copier</button>
            <a class="btn glass" id="preview" target="_blank" rel="noopener">Tester</a>
          </div>
          <p class="feedback" id="copy-feedback" aria-live="polite"></p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer"><a href="index.html">← Retour</a><span>·</span><span>Photos <a href="https://www.pexels.com" target="_blank" rel="noopener">Pexels</a></span></footer>
  <script src="js/creer.js"></script>
</body>
</html>

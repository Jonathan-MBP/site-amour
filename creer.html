<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crée ton lien 💘</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="hearts" aria-hidden="true"></div>

  <main class="card">
    <section class="step active">
      <div class="emoji big">💘</div>
      <h1>Crée ton lien</h1>
      <p class="lead">Remplis, copie le lien, envoie-le. C'est tout.</p>

      <form id="create-form" autocomplete="off">
        <label class="label" for="pour">Son prénom</label>
        <input id="pour" type="text" maxlength="30" placeholder="Ex : Inès" required>

        <label class="label" for="de">Ton prénom</label>
        <input id="de" type="text" maxlength="30" placeholder="Ex : Jonathan" required>

        <label class="label" for="tel">Ton numéro WhatsApp (optionnel)</label>
        <input id="tel" type="tel" maxlength="20" placeholder="Ex : 33612345678">
        <p class="hint">Format international sans le « + ». Sans numéro, la réponse s'envoie par SMS ou partage.</p>

        <button class="btn primary" type="submit">Générer le lien</button>
      </form>

      <div class="result" id="result" hidden>
        <input id="link" type="text" readonly aria-label="Lien généré">
        <div class="row">
          <button class="btn primary" id="copy">Copier</button>
          <a class="btn ghost" id="preview" target="_blank" rel="noopener">Tester</a>
        </div>
        <p class="feedback" id="copy-feedback" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <footer class="footer"><a href="index.html">← Retour</a></footer>
  <script src="js/creer.js"></script>
</body>
</html>
